services:
  app:
    build: .
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/HealthTracker
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - network

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SPRING_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shashwat -d HealthTracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    networks:
      - network
    volumes:
      - postgres-bose-data:/var/lib/postgresql/data

networks:
  network:
    driver: bridge

volumes:
  postgres-bose-data:
