<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#263238"/>
    </marker>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b42318"/>
    </marker>
    <style>
      .page { fill: #f6f8fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #17202a; }
      .note { font: 400 15px Arial, sans-serif; fill: #4a5565; }
      .group { fill: #ffffff; stroke: #c9d3df; stroke-width: 1.5; rx: 12; }
      .box { stroke-width: 2; rx: 10; }
      .client { fill: #e8f6f3; stroke: #11806a; }
      .entry { fill: #eef4ff; stroke: #2f5fc4; }
      .controller { fill: #eaf2ff; stroke: #2463eb; }
      .service { fill: #edf9f0; stroke: #1f8f45; }
      .repo { fill: #fff3e6; stroke: #d46b08; }
      .entity { fill: #fffbe6; stroke: #b98900; }
      .db { fill: #fceff6; stroke: #c0266d; }
      .config { fill: #f3efff; stroke: #7852cc; }
      .warn { fill: #fff1f0; stroke: #b42318; }
      .h { font: 700 18px Arial, sans-serif; fill: #17202a; }
      .t { font: 400 14px Arial, sans-serif; fill: #263238; }
      .s { font: 400 12px Arial, sans-serif; fill: #52616f; }
      .flow { stroke: #263238; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .soft { stroke-dasharray: 8 6; }
      .warnLine { stroke: #b42318; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; marker-end: url(#warnArrow); }
    </style>
  </defs>

  <rect class="page" width="1280" height="760"/>
  <text class="title" x="48" y="54">HealthTracker Flow Diagram</text>
  <text class="note" x="48" y="82">How the codebase components connect at runtime in this Spring Boot application.</text>

  <rect class="group" x="38" y="112" width="1204" height="540"/>
  <text class="h" x="62" y="145">Main Application Flow</text>

  <rect class="box client" x="72" y="250" width="170" height="92"/>
  <text class="h" x="121" y="285">Client</text>
  <text class="t" x="99" y="312">Browser / Postman</text>
  <text class="s" x="96" y="332">HTTP requests</text>

  <rect class="box entry" x="295" y="250" width="210" height="92"/>
  <text class="h" x="325" y="284">Spring Boot App</text>
  <text class="t" x="325" y="311">HealthTrackerApplication</text>
  <text class="s" x="336" y="331">component scan starts here</text>

  <rect class="box controller" x="570" y="165" width="240" height="110"/>
  <text class="h" x="616" y="200">HelloController</text>
  <text class="t" x="628" y="228">GET /</text>
  <text class="s" x="616" y="250">returns "Hello World"</text>

  <rect class="box controller" x="570" y="330" width="240" height="125"/>
  <text class="h" x="617" y="365">UserController</text>
  <text class="t" x="612" y="393">GET /users</text>
  <text class="t" x="612" y="416">POST /addUser</text>
  <text class="s" x="612" y="438">receives Users JSON body</text>

  <rect class="box service" x="875" y="350" width="210" height="86"/>
  <text class="h" x="930" y="385">UserService</text>
  <text class="t" x="908" y="413">getUsers(), saveUser()</text>

  <rect class="box repo" x="875" y="500" width="210" height="86"/>
  <text class="h" x="938" y="535">UserRepo</text>
  <text class="t" x="905" y="563">JpaRepository&lt;Users, Integer&gt;</text>

  <rect class="box db" x="1115" y="500" width="95" height="86"/>
  <text class="h" x="1130" y="535">DB</text>
  <text class="t" x="1128" y="563">PostgreSQL</text>

  <rect class="box entity" x="570" y="520" width="210" height="86"/>
  <text class="h" x="650" y="554">Users</text>
  <text class="t" x="612" y="582">@Entity, @Id uname</text>

  <rect class="box entity" x="300" y="500" width="210" height="86"/>
  <text class="h" x="351" y="535">DailyTracker</text>
  <text class="t" x="341" y="563">@Entity, UUID id</text>

  <rect class="box entity" x="300" y="620" width="210" height="66"/>
  <text class="h" x="340" y="648">NutrientsInFlow</text>
  <text class="s" x="335" y="670">fat, protein, carbs, fiber</text>

  <rect class="box config" x="72" y="445" width="210" height="92"/>
  <text class="h" x="104" y="480">application.properties</text>
  <text class="t" x="103" y="507">datasource + JPA</text>
  <text class="s" x="123" y="527">ddl-auto=update</text>

  <rect class="box config" x="72" y="575" width="210" height="76"/>
  <text class="h" x="144" y="610">pom.xml</text>
  <text class="s" x="101" y="634">WebMVC, JPA, Lombok, PostgreSQL</text>

  <rect class="box warn" x="838" y="160" width="350" height="88"/>
  <text class="h" x="862" y="193">Mapping issue to review</text>
  <text class="s" x="862" y="218">Users has @OneToMany(mappedBy = "Users")</text>
  <text class="s" x="862" y="238">but DailyTracker does not define a Users field.</text>

  <path class="flow" d="M242 296 L295 296"/>
  <path class="flow soft" d="M505 296 C535 296 535 220 570 220"/>
  <path class="flow" d="M505 296 C535 296 535 393 570 393"/>
  <path class="flow" d="M810 393 L875 393"/>
  <path class="flow" d="M980 436 L980 500"/>
  <path class="flow" d="M1085 543 L1115 543"/>
  <path class="flow soft" d="M875 543 L780 563"/>
  <path class="flow soft" d="M570 563 L510 543"/>
  <path class="flow" d="M405 586 L405 620"/>
  <path class="flow soft" d="M177 445 C177 390 250 350 318 335"/>
  <path class="flow soft" d="M177 575 C177 545 230 525 300 525"/>
  <path class="warnLine" d="M838 238 C735 280 720 480 675 520"/>

  <text class="s" x="256" y="286">HTTP</text>
  <text class="s" x="838" y="382">calls</text>
  <text class="s" x="990" y="470">uses</text>
  <text class="s" x="1092" y="532">JPA/JDBC</text>
  <text class="s" x="792" y="552">persists</text>
  <text class="s" x="516" y="528">intended relation</text>
  <text class="s" x="416" y="608">one-to-one</text>

  <rect class="group" x="38" y="675" width="1204" height="54"/>
  <text class="t" x="62" y="708">Legend: solid arrows = runtime request/data flow, dashed arrows = configuration/entity relationships, red dashed arrow = mapping issue found in the current code.</text>
</svg>
