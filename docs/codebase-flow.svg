<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">HealthTracker Project Graph</title>
  <desc id="desc">Architecture graph for the HealthTracker Spring Boot project showing request flow, JWT security, environment-based secret configuration, service layer, repositories, entities, and PostgreSQL persistence.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#24313d"/>
    </marker>
    <marker id="softArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#65758b"/>
    </marker>
    <marker id="warnArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#b42318"/>
    </marker>
    <style>
      :root {
        color-scheme: light;
      }

      .page {
        fill: #f5f7fa;
      }

      .title {
        font: 700 34px Arial, Helvetica, sans-serif;
        fill: #13202d;
      }

      .subtitle {
        font: 400 16px Arial, Helvetica, sans-serif;
        fill: #546173;
      }

      .band {
        fill: #ffffff;
        stroke: #c9d3df;
        stroke-width: 1.4;
        rx: 8;
      }

      .bandTitle {
        font: 700 18px Arial, Helvetica, sans-serif;
        fill: #24313d;
      }

      .node {
        stroke-width: 2;
        rx: 8;
      }

      .client {
        fill: #e6f7f4;
        stroke: #0f766e;
      }

      .app {
        fill: #edf4ff;
        stroke: #2563eb;
      }

      .security {
        fill: #f2edff;
        stroke: #7c3aed;
      }

      .guard {
        fill: #eefcf6;
        stroke: #047857;
      }

      .warn {
        fill: #fff1f0;
        stroke: #b42318;
      }

      .controller {
        fill: #eaf2ff;
        stroke: #1d4ed8;
      }

      .service {
        fill: #ecfdf3;
        stroke: #15803d;
      }

      .repo {
        fill: #fff7ed;
        stroke: #c2410c;
      }

      .model {
        fill: #fffbeb;
        stroke: #b45309;
      }

      .dto {
        fill: #f0f9ff;
        stroke: #0284c7;
      }

      .db {
        fill: #fdf2f8;
        stroke: #be185d;
      }

      .config {
        fill: #f8fafc;
        stroke: #475569;
      }

      .nodeTitle {
        font: 700 17px Arial, Helvetica, sans-serif;
        fill: #17212b;
      }

      .nodeText {
        font: 400 13px Arial, Helvetica, sans-serif;
        fill: #263442;
      }

      .small {
        font: 400 12px Arial, Helvetica, sans-serif;
        fill: #64748b;
      }

      .label {
        font: 700 11px Arial, Helvetica, sans-serif;
        fill: #475569;
        text-transform: uppercase;
      }

      .flow {
        stroke: #24313d;
        stroke-width: 2.4;
        fill: none;
        marker-end: url(#arrow);
      }

      .softFlow {
        stroke: #65758b;
        stroke-width: 2;
        stroke-dasharray: 8 7;
        fill: none;
        marker-end: url(#softArrow);
      }

      .relationship {
        stroke: #8a5a16;
        stroke-width: 2;
        fill: none;
        marker-end: url(#softArrow);
      }

      .warnFlow {
        stroke: #b42318;
        stroke-width: 2;
        stroke-dasharray: 8 7;
        fill: none;
        marker-end: url(#warnArrow);
      }

      .divider {
        stroke: #d8e0ea;
        stroke-width: 1.2;
      }
    </style>
  </defs>

  <rect class="page" width="1440" height="980"/>

  <text class="title" x="52" y="58">HealthTracker Project Graph</text>
  <text class="subtitle" x="52" y="86">Spring Boot request flow, JWT security wiring, environment configuration, service/repository layers, and JPA entity relationships.</text>

  <rect class="band" x="40" y="118" width="1360" height="330"/>
  <text class="bandTitle" x="64" y="151">Runtime Request Flow</text>

  <rect class="node client" x="70" y="210" width="165" height="92"/>
  <text class="nodeTitle" x="120" y="244">Client</text>
  <text class="nodeText" x="101" y="271">Browser / Postman</text>
  <text class="small" x="105" y="292">HTTP request</text>

  <rect class="node app" x="292" y="210" width="230" height="92"/>
  <text class="nodeTitle" x="328" y="244">Spring Boot App</text>
  <text class="nodeText" x="326" y="271">HealthTrackerApplication</text>
  <text class="small" x="332" y="292">starts component scan</text>

  <rect class="node security" x="580" y="166" width="250" height="92"/>
  <text class="nodeTitle" x="650" y="200">SecurityConfig</text>
  <text class="nodeText" x="613" y="226">JWT filter + stateless sessions</text>
  <text class="small" x="614" y="247">@EnableMethodSecurity active</text>

  <rect class="node guard" x="580" y="270" width="250" height="34"/>
  <text class="nodeText" x="620" y="292">JwtFilter reads Bearer token</text>

  <rect class="node controller" x="580" y="316" width="250" height="104"/>
  <text class="nodeTitle" x="642" y="349">Controllers</text>
  <text class="nodeText" x="615" y="376">/login and /register are public</text>
  <text class="nodeText" x="615" y="397">owner endpoints use @PreAuthorize</text>

  <rect class="node warn" x="900" y="166" width="455" height="92"/>
  <text class="nodeTitle" x="1041" y="199">Authorization note</text>
  <text class="nodeText" x="930" y="225">GET /users is available to any authenticated user</text>
  <text class="nodeText" x="930" y="246">Owner routes compare path id with authentication.name</text>

  <rect class="node service" x="900" y="316" width="210" height="104"/>
  <text class="nodeTitle" x="959" y="349">UserService</text>
  <text class="nodeText" x="935" y="376">business logic</text>
  <text class="small" x="930" y="397">register, fetch, tracker edit</text>

  <rect class="node repo" x="1170" y="316" width="185" height="104"/>
  <text class="nodeTitle" x="1213" y="349">Repositories</text>
  <text class="nodeText" x="1202" y="376">Spring Data JPA</text>
  <text class="small" x="1205" y="397">query/save entities</text>

  <path class="flow" d="M235 256 L292 256"/>
  <path class="flow" d="M522 256 C548 256 548 212 580 212"/>
  <path class="flow" d="M705 258 L705 270"/>
  <path class="flow" d="M705 304 L705 316"/>
  <path class="flow" d="M830 368 L900 368"/>
  <path class="flow" d="M1110 368 L1170 368"/>
  <path class="warnFlow" d="M1128 258 C1046 295 940 324 830 342"/>

  <text class="label" x="249" y="245">HTTP</text>
  <text class="label" x="539" y="232">filters</text>
  <text class="label" x="715" y="286">extracts</text>
  <text class="label" x="849" y="356">calls</text>
  <text class="label" x="1126" y="356">uses</text>

  <rect class="band" x="40" y="480" width="655" height="365"/>
  <text class="bandTitle" x="64" y="513">Authentication Path</text>

  <rect class="node security" x="72" y="555" width="210" height="86"/>
  <text class="nodeTitle" x="123" y="588">POST /login</text>
  <text class="nodeText" x="103" y="615">LoginRequest credentials</text>

  <rect class="node security" x="352" y="555" width="250" height="86"/>
  <text class="nodeTitle" x="389" y="588">DaoAuthenticationProvider</text>
  <text class="nodeText" x="408" y="615">validates username/password</text>

  <rect class="node service" x="72" y="704" width="230" height="86"/>
  <text class="nodeTitle" x="105" y="737">MyUserDetailsService</text>
  <text class="nodeText" x="109" y="764">loadUserByUsername()</text>

  <rect class="node model" x="372" y="704" width="210" height="86"/>
  <text class="nodeTitle" x="417" y="737">UserPrinciple</text>
  <text class="nodeText" x="411" y="760">username = user.uname</text>
  <text class="small" x="414" y="779">authority = USER</text>

  <rect class="node service" x="252" y="798" width="190" height="32"/>
  <text class="small" x="300" y="819">JwtService signs token</text>

  <path class="flow" d="M282 598 L352 598"/>
  <path class="flow" d="M477 641 C477 665 420 676 302 727"/>
  <path class="flow" d="M302 747 L372 747"/>
  <path class="softFlow" d="M477 641 L365 798"/>
  <path class="softFlow" d="M442 814 C515 818 574 766 580 641"/>

  <text class="label" x="304" y="586">authenticates</text>
  <text class="label" x="379" y="676">loads user</text>
  <text class="label" x="315" y="737">returns</text>

  <rect class="band" x="725" y="480" width="675" height="365"/>
  <text class="bandTitle" x="749" y="513">Persistence And Domain Model</text>

  <rect class="node repo" x="760" y="550" width="175" height="78"/>
  <text class="nodeTitle" x="811" y="582">UserRepo</text>
  <text class="small" x="785" y="607">JpaRepository&lt;Users, String&gt;</text>

  <rect class="node repo" x="760" y="660" width="205" height="78"/>
  <text class="nodeTitle" x="800" y="692">DailyTrackerRepo</text>
  <text class="small" x="798" y="717">findByUnameAndDate()</text>

  <rect class="node repo" x="760" y="770" width="225" height="78"/>
  <text class="nodeTitle" x="794" y="802">NutrientsInFlowRepo</text>
  <text class="small" x="804" y="827">JpaRepository&lt;Nutrients, UUID&gt;</text>

  <rect class="node model" x="1050" y="550" width="160" height="78"/>
  <text class="nodeTitle" x="1102" y="582">Users</text>
  <text class="small" x="1085" y="604">@Entity, uname PK</text>
  <text class="small" x="1096" y="620">password, role</text>

  <rect class="node model" x="1050" y="672" width="190" height="78"/>
  <text class="nodeTitle" x="1093" y="704">DailyTracker</text>
  <text class="small" x="1095" y="729">@Entity, UUID PK</text>

  <rect class="node model" x="1050" y="790" width="210" height="78"/>
  <text class="nodeTitle" x="1085" y="822">NutrientsInFlow</text>
  <text class="small" x="1082" y="847">fat, protein, carbs, fiber</text>

  <rect class="node db" x="1300" y="650" width="72" height="92"/>
  <text class="nodeTitle" x="1317" y="686">DB</text>
  <text class="small" x="1309" y="712">PostgreSQL</text>

  <path class="flow" d="M935 589 L1050 589"/>
  <path class="flow" d="M965 699 L1050 711"/>
  <path class="flow" d="M985 809 L1050 829"/>
  <path class="flow" d="M1210 589 C1270 589 1270 680 1300 680"/>
  <path class="flow" d="M1240 711 L1300 711"/>
  <path class="flow" d="M1260 829 C1296 829 1292 742 1300 726"/>

  <path class="relationship" d="M1130 628 L1138 672"/>
  <path class="relationship" d="M1148 750 L1153 790"/>

  <text class="label" x="990" y="577">entity</text>
  <text class="label" x="1268" y="668">JPA</text>
  <text class="label" x="1160" y="654">one-to-many</text>
  <text class="label" x="1162" y="775">one-to-one</text>

  <rect class="node dto" x="516" y="862" width="235" height="58"/>
  <text class="nodeTitle" x="559" y="895">UserTrackerRecords</text>
  <text class="small" x="558" y="915">DTO returned for user details</text>

  <rect class="node config" x="78" y="862" width="190" height="58"/>
  <text class="nodeTitle" x="112" y="895">application.properties</text>
  <text class="small" x="102" y="915">imports .env, datasource, JPA</text>

  <rect class="node config" x="300" y="862" width="155" height="58"/>
  <text class="nodeTitle" x="349" y="895">pom.xml</text>
  <text class="small" x="314" y="915">WebMVC, JPA, Security, JJWT</text>

  <rect class="node config" x="820" y="862" width="170" height="58"/>
  <text class="nodeTitle" x="878" y="895">.env</text>
  <text class="small" x="851" y="915">JWT_SECRET, gitignored</text>

  <path class="softFlow" d="M268 891 L760 589"/>
  <path class="softFlow" d="M455 891 L580 212"/>
  <path class="softFlow" d="M582 862 C678 808 822 746 900 420"/>
  <path class="softFlow" d="M820 891 C650 850 492 824 442 814"/>
  <path class="softFlow" d="M820 891 L268 891"/>

  <line class="divider" x1="40" y1="946" x2="1400" y2="946"/>
  <text class="small" x="52" y="966">Legend: solid arrows show runtime/data flow, dashed arrows show configuration/DTO support, brown arrows show JPA relationships.</text>
</svg>
